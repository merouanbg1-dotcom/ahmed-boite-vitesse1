<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahmed Boîte Vitesse — Spécialiste boîte de vitesses · Ouled Moussa & Bouira</title>
<link rel="icon" href="images/favicon.png">
<meta name="description" content="Diagnostic scanner, vidange, réparation et pièces pour boîtes manuelles, automatiques, DSG et CVT. Ouled Moussa (Boumerdès) et Bouira.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;600;700;800;900&display=swap">
<style>
/* ============ Couleurs et typo — modifiez ici ============ */
:root{
  --red:#E31B23; --red-dark:#8E0F14; --red-text:#FF5A5F;
  --bg:#0B0B0C; --surface:#151518; --surface-2:#1C1C20; --line:#2A2A2F; --line-2:#3A3A40;
  --text:#FFFFFF; --muted:#B9B9C2; --muted-2:#C9C9D1; --yellow:#F5C518;
  --body:'Inter',system-ui,sans-serif; --head:'Montserrat','Inter',sans-serif;
}
html[lang="ar"]{ --body:'Cairo',system-ui,sans-serif; --head:'Cairo',system-ui,sans-serif; }
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);color:var(--text);background:var(--bg);line-height:1.5}
a{color:var(--text)} a:hover{color:var(--red-text)}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.12}
p{margin:0}
.wrap{max-width:none;margin:0;padding:0 clamp(16px,4vw,72px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;font-size:16px;min-height:48px;padding:12px 24px;border-radius:6px;text-decoration:none;cursor:pointer;border:1.5px solid transparent;text-align:center}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{color:#fff;background:#C8141B}
.btn-ghost{border-color:#fff;color:#fff;background:transparent}
.btn-ghost:hover{color:#fff;border-color:var(--red);background:var(--red)}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--red-text)}
.eyebrow::before{content:"";width:32px;height:3px;background:var(--red)}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--red-text);outline-offset:2px}

/* Barre du haut + header */
.topbar{background:var(--red);font-size:13px;font-weight:600}
.topbar .wrap{display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between;padding-top:8px;padding-bottom:8px}
.topbar a{text-decoration:none}
.topbar .phones{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center}
.social{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700}
.social .ico{width:30px;height:30px;border-radius:50%;background:#fff;color:#0B0B0C;display:inline-flex;align-items:center;justify-content:center;flex:none}
.topbar .social .ico{width:24px;height:24px;background:#0B0B0C;color:#fff}
.social.big{border:1.5px solid var(--line-2);border-radius:6px;padding:10px 14px;min-height:48px;align-self:flex-start}
.social.big:hover{border-color:var(--red)}
header{background:var(--bg);border-bottom:1px solid #26262B;position:sticky;top:0;z-index:20}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-top:14px;padding-bottom:14px}
.logo{display:flex;align-items:center;text-decoration:none}
.logo img{height:78px;width:auto}
.foot-logo{display:inline-block}
.foot-logo img{height:70px;width:auto}
.logo .mark{width:42px;height:42px;border-radius:8px;background:var(--red);display:flex;align-items:center;justify-content:center}
.logo .a{display:block;font-family:var(--head);font-weight:900;font-size:20px;letter-spacing:.5px;line-height:1}
.logo .b{display:block;font-family:var(--head);font-weight:800;font-size:13px;letter-spacing:2px;color:var(--red-text);line-height:1.3}
nav.main{display:flex;flex-wrap:wrap;gap:6px 26px;font-size:15px;font-weight:600}
nav.main a{text-decoration:none;padding:6px 0}
nav.main a[aria-current="page"]{color:var(--red-text);box-shadow:inset 0 -2px 0 var(--red)}
.head-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.langs{display:flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.langs button{font:inherit;font-size:14px;min-width:44px;min-height:40px;padding:0 10px;border:0;cursor:pointer;background:var(--surface);color:#fff}
.langs button[aria-pressed="true"]{background:var(--red);font-weight:800}

/* Hero */
.hero{display:flex;flex-wrap:wrap;gap:40px;align-items:center;padding-top:56px;padding-bottom:64px}
.hero-text{flex:1 1 460px;min-width:0;display:flex;flex-direction:column;gap:20px;position:relative;z-index:2}
.hero h1{font-weight:900;font-size:clamp(40px,5.5vw,66px);letter-spacing:-1px}
.hero h1 .r{display:block;color:var(--red)}
.hero-sub{font-size:18px;line-height:1.6;color:var(--muted-2);max-width:520px}
.points{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:8px}
.points span{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#E4E4EA}
.hero-visual{flex:1.2 1 520px;min-width:0;position:relative;height:clamp(420px,42vw,640px)}
.hero-visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 70%;border-radius:4px}
.chev{position:absolute;top:0;bottom:0;z-index:2;clip-path:polygon(0 0,45% 0,100% 50%,45% 100%,0 100%,55% 50%)}
.chev.c1{left:-10px;width:180px;background:var(--red)}
.chev.c2{left:70px;width:120px;top:40px;bottom:40px;background:var(--red-dark)}
html[dir="rtl"] .chev{transform:scaleX(-1)}
html[dir="rtl"] .chev.c1{left:auto;right:-10px}
html[dir="rtl"] .chev.c2{left:auto;right:70px}

/* Sections */
section{padding:0 0 72px}
.section-title{font-size:clamp(28px,3.6vw,36px);font-weight:800}
.framed{border:1.5px solid var(--red);border-radius:6px;padding:0 28px 32px}
.framed-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:-22px;margin-bottom:28px}
.framed-head h2{background:var(--bg);padding:0 16px;font-size:30px;font-weight:800}
.badge{background:var(--red);color:#fff;font-size:13px;font-weight:700;padding:10px 18px;border-radius:4px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px;display:flex;flex-direction:column;gap:12px}
.svc .ic{width:48px;height:48px;border-radius:6px;background:#2A0A0C;border:1px solid var(--red);display:flex;align-items:center;justify-content:center}
.svc h3{font-size:19px;font-weight:800}
.svc p{font-size:15px;line-height:1.6;color:var(--muted);flex-grow:1}
.svc .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.svc .bar i{display:block;height:4px;width:60%;background:var(--red)}
.svc .foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.quote{font-size:14px;font-weight:700;color:var(--red-text)}
.btn-sm{background:var(--red);color:#fff;text-decoration:none;font-size:13px;font-weight:700;padding:10px 14px;border-radius:4px;min-height:40px;display:inline-flex;align-items:center}
.btn-sm:hover{color:#fff;background:#C8141B}
.banners{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.banner{text-decoration:none;border-radius:6px;overflow:hidden;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column}
.banner .pic{height:220px;background:#fff;position:relative}
.banner .pic img{width:100%;height:100%;object-fit:cover}
.banner .pic img.contain{object-fit:contain}
.banner .tag{position:absolute;top:14px;inset-inline-start:14px;background:var(--red);color:#fff;font-size:12px;font-weight:800;letter-spacing:1px;padding:6px 10px;border-radius:3px;text-transform:uppercase}
.banner .txt{padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.banner h3{font-size:21px;font-weight:800;color:#fff}
.banner .go{margin-top:8px;font-size:13px;font-weight:800;letter-spacing:1px;color:var(--red-text);text-transform:uppercase}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:14px;align-items:center;font-size:16px;font-weight:600}
.steps .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:800}
.band{background:var(--surface);border-top:1px solid #26262B;border-bottom:1px solid #26262B;padding:64px 0;margin-bottom:72px}
.band .wrap{display:flex;flex-wrap:wrap;gap:40px;align-items:center}
.band .pic{flex:1 1 440px;position:relative;height:380px;border-radius:6px;overflow:hidden;background:#fff}
.band .pic img{width:100%;height:100%;object-fit:cover}
.band .pic .btn{position:absolute;bottom:20px;inset-inline-end:20px}
.info-cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.info{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:6px;padding:26px;display:flex;flex-direction:column;gap:10px}
.info .lbl{font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--red-text)}
.info .ph{text-decoration:none;display:flex;flex-direction:column}
.info .ph b{font-family:'Montserrat',sans-serif;font-weight:800;font-size:22px}
.map{border-radius:6px;overflow:hidden;border:1px solid var(--line);margin-top:16px;height:360px;background:var(--surface)}
.map iframe{width:100%;height:100%;border:0;display:block;filter:grayscale(.3) contrast(1.05)}
footer{border-top:1px solid #26262B;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:22px;padding-bottom:22px}
footer details{width:100%}
footer summary{cursor:pointer;color:var(--muted)}
footer .credits{font-size:12px;line-height:1.7;margin-top:8px}
footer .credits a{color:var(--muted)}

/* Pièces */
.shop{display:flex;flex-wrap:wrap;border:1.5px solid var(--red);border-radius:6px;overflow:hidden}
.cats{flex:1 1 240px;background:#fff;color:#16181C;display:flex;flex-direction:column}
.cats .t{padding:18px 20px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;border-bottom:1px solid #E4E4E8}
.cats button{font:inherit;font-size:14px;font-weight:500;text-align:start;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 20px;min-height:46px;border:0;border-bottom:1px solid #E4E4E8;background:#fff;color:#2A2D33}
.cats button[aria-pressed="true"]{background:#FDECEC;color:#B3121A;font-weight:700}
.shop-main{flex:999 1 640px;min-width:0;display:flex;flex-direction:column}
.searchrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.searchrow input{flex:1 1 280px;font:inherit;font-size:15px;padding:12px 14px;min-height:46px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg);color:#fff}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.part{border-inline-start:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px}
.part .pic{height:150px;border-radius:4px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.part .pic img{width:100%;height:100%;object-fit:cover}
.part .pic .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--surface);color:#5A5A62}
.part .pic.has-img .ph{display:none}
.part .cat{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.5px;padding:4px 8px;border-radius:3px;background:var(--yellow);color:#16181C}
.part h3{font-size:16px;font-weight:700;line-height:1.3;flex-grow:1}
.part .acts{display:flex;gap:8px}
.part .acts .btn-sm{flex:1;justify-content:center;min-height:44px}
.icon-btn{width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;border-radius:4px;color:#fff}
.photo-note{font-size:12px;color:var(--muted);padding:12px 20px}

/* Formulaires */
.page-head{padding:44px 0 24px;display:flex;flex-direction:column;gap:10px}
.page-head h1{font-size:clamp(32px,4vw,46px);font-weight:900}
.layout{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;padding-bottom:80px}
.layout form{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:22px}
fieldset{margin:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
legend{font-family:var(--head);font-weight:800;font-size:19px;padding:0 10px;background:var(--red);border-radius:3px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
input,select,textarea{font:inherit;font-weight:400;font-size:16px;padding:12px;min-height:48px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg);color:#fff;width:100%}
select:disabled{opacity:.6}
textarea{resize:vertical;min-height:90px}
input::placeholder,textarea::placeholder{color:#8A8A93}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:start}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:inherit;font-size:15px;font-weight:500;cursor:pointer;border-radius:4px;padding:10px 16px;min-height:44px;border:1.5px solid var(--line-2);background:var(--bg);color:#fff}
.pill[aria-pressed="true"]{border-color:var(--red);background:var(--red);font-weight:700}
.days{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tile{font:inherit;font-size:15px;font-weight:600;text-align:start;cursor:pointer;border-radius:4px;padding:12px 14px;min-height:52px;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line-2);background:var(--bg);color:#fff}
.tile .ck{flex:none;width:20px;height:20px;border-radius:3px;border:2px solid #8A8A93;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.tile[aria-pressed="true"]{border-color:var(--red);background:#2A0A0C}
.tile[aria-pressed="true"] .ck{background:var(--red);border-color:var(--red)}
aside.recap{flex:1 1 320px;min-width:0;background:#fff;color:#16181C;border-radius:6px;border-top:5px solid var(--red);padding:24px;display:flex;flex-direction:column;gap:14px;position:sticky;top:110px}
aside.recap h2{font-size:22px;font-weight:800}
aside.recap dl{margin:0;display:flex;flex-direction:column;gap:12px}
aside.recap dt{color:#5A5F67;font-size:13px}
aside.recap dd{margin:2px 0 0;font-weight:700}
aside.recap a{color:#B3121A}
aside.recap .note{font-size:13px;color:#4A4F57}
.err{color:#B91C1C;font-size:14px;font-weight:700}
.time-msg{font-size:14px;color:var(--muted)}
.time-msg.bad{color:var(--red-text);font-weight:700}
.done{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--red);border-radius:6px;padding:40px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;margin-bottom:80px}

/* Suivi */
.track{max-width:540px;margin:0 auto;padding:44px 24px 80px;display:flex;flex-direction:column;gap:18px}
.demo-note{font-size:13px;background:#3A2A00;color:#FDE68A;border-radius:4px;padding:10px 12px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:14px}
.timeline .rail{display:flex;flex-direction:column;align-items:center}
.dot{width:16px;height:16px;border-radius:50%;flex:none;background:var(--bg);border:2px solid #6A6A72}
.dot.done{background:#fff;border-color:#fff}
.dot.now{border:4px solid var(--red)}
.vbar{width:2px;flex:1;min-height:22px;background:var(--line-2)}
.vbar.done{background:#fff}
.timeline .txt{padding-bottom:16px}

@media (max-width:700px){
  header{position:static}
  .topbar .phones>span{display:none}
  .topbar .wrap{align-items:center}
  .head{gap:10px 12px}
  .logo{order:1}
  .head-right{order:2}
  .head-right .btn{display:none}
  nav.main{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:20px;font-size:15px}
  nav.main a{white-space:nowrap}
  .logo img{height:58px}
  .hero{padding-top:32px;gap:28px}
  .hero-visual{height:320px}
  .chev.c1{width:110px}.chev.c2{width:80px;left:40px}
  html[dir="rtl"] .chev.c2{right:40px}
  .framed{padding:0 16px 20px}
  aside.recap{position:static}
}
</style>
</head>

    '<p class="note">' + esc(x.orCall) + ' <a href="tel:+' + ph.intl + '" dir="ltr" style="font-weight:700">' + ph.display + '</a></p>';

function timeMsgHtml() { const x = t(); const h = curHours(); return fill(timeValid() ? x.openFromTo : x.timeBad, { a: h[0], b: h[1] }); }
function rdvPage() {

      '<h1 style="font-size:30px;font-weight:900">' + esc(ok ? x.savedTitle : (rdv.saved === false ? x.saveErr : x.sentTitle)) + '</h1>' +

      '<div style="display:flex;flex-wrap:wrap;gap:10px">' + (rdv.waUrl ? '<a class="btn btn-red" href="' + esc(rdv.waUrl) + '" target="_blank" rel="noopener">' + esc(ok ? x.alsoWa : x.confirm) + '</a>' : '') +

  }

    '<fieldset><legend>' + esc(x.s2) + '</legend>' +
      '<div><p style="font-size:14px;font-weight:600;margin-bottom:10px">' + esc(x.boxType) + '</p><div class="pills">' + Object.keys(x.bx).map((k) => '<button type="button" class="pill" data-act="box" data-v="' + k + '" aria-pressed="' + (rdv.box === k) + '">' + esc(x.bx[k]) + '</button>').join('') + '</div></div>' +
      '<div class="cols">' +
        '<div style="display:flex;flex-direction:column;gap:8px"><label class="f">' + esc(x.brandL) + '<select data-field="brand">' + opt('', x.choose, !rdv.brand) + Object.keys(CARS).map((b) => opt(b, b, rdv.brand === b)).join('') + opt('__other', x.other, rdv.brand === '__other') + '</select></label>' +
          (rdv.brand === '__other' ? '<label class="f" style="font-size:13px">' + esc(x.typeBrand) + '<input type="text" data-field="brandOther" value="' + esc(rdv.brandOther) + '"></label>' : '') + '</div>' +
        '<div style="display:flex;flex-direction:column;gap:8px">' +
          (rdv.brand === '__other' ? '' : '<label class="f">' + esc(x.modelL) + '<select data-field="model"' + (rdv.brand ? '' : ' disabled') + '>' + opt('', rdv.brand ? x.choose : x.chooseBrandFirst, !rdv.model) + models.map((m) => opt(m, m, rdv.model === m)).join('') + opt('__other', x.other, rdv.model === '__other') + '</select></label>') +
          ((rdv.brand === '__other' || rdv.model === '__other') ? '<label class="f" style="font-size:13px">' + esc(x.typeModel) + '<input type="text" data-field="modelOther" value="' + esc(rdv.modelOther) + '"></label>' : '') + '</div>' +
        '<label class="f">' + esc(x.yearL) + '<input type="text" inputmode="numeric" maxlength="4" placeholder="2018" data-field="year" value="' + esc(rdv.year) + '"></label>' +
      '</div>' +
      '<label class="f">' + esc(x.symptoms) + '<textarea rows="3" data-field="notes" placeholder="' + esc(x.symptomsPh) + '">' + esc(rdv.notes) + '</textarea></label></fieldset>' +
    '<fieldset><legend>' + esc(x.s3) + '</legend>' +
      '<div><p style="font-size:14px;font-weight:600;margin-bottom:10px">' + esc(x.workshop) + '</p><div class="pills">' + Object.keys(x.shops).map((k) => '<button type="button" class="pill" data-act="shop" data-v="' + k + '" aria-pressed="' + (rdv.shop === k) + '">' + esc(x.shops[k]) + '</button>').join('') + '</div></div>' +
      '<div><p style="font-size:14px;font-weight:600;margin-bottom:10px">' + esc(x.day) + ' <span class="muted" style="font-weight:400">' + esc(x.dayHint) + '</span></p><div class="days">' +
        days.map((d, i) => '<button type="button" class="pill" data-act="day" data-v="' + i + '" aria-pressed="' + (rdv.day === i) + '">' + esc(fmtDay(d)) + '</button>').join('') + '</div></div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end"><label class="f">' + esc(x.time) + '<input type="time" dir="ltr" min="' + h[0] + '" max="' + h[1] + '" step="300" data-field="time" value="' + esc(rdv.time) + '" style="width:180px;font-size:18px;font-weight:700;color-scheme:dark"></label>' +
        '<p id="time-msg" class="time-msg' + (timeValid() ? '' : ' bad') + '" style="margin-bottom:12px">' + esc(timeMsgHtml()) + '</p></div>' +
      '<div class="cols"><label class="f">' + esc(x.name) + '<input type="text" autocomplete="name" data-field="name" value="' + esc(rdv.name) + '"></label>' +
        '<label class="f">' + esc(x.phone) + '<input type="tel" dir="ltr" autocomplete="tel" placeholder="05 / 06 / 07 …" data-field="phone" value="' + esc(rdv.phone) + '"></label></div></fieldset>' +
  '</form><aside class="recap" id="recap">' + rdvRecapHtml() + '</aside></div></div>';

const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
async function rdvSubmit() {
  const x = t();
  if (rdv.sending) return;
  if (!rdv.services.length) rdv.error = x.errServices;
  else if (!timeValid()) rdv.error = x.errTime;
  else if (!rdv.name.trim() || !rdv.phone.trim()) rdv.error = x.errName;
  else rdv.error = '';
  if (rdv.error) { document.getElementById('recap').innerHTML = rdvRecapHtml(); return; }
  const days = rdvDays(); const day = days[rdv.day];
  const lines = [x.waHello,
    '• ' + x.recServices + ' : ' + rdv.services.map((k) => x.svc[k]).join(', '),
    '• ' + x.recCar + ' : ' + (rdvCar() || x.none),
    '• ' + x.workshop + ' : ' + x.shops[rdv.shop],
    '• ' + x.recWhen + ' : ' + fmtDay(day) + ' ' + x.at + ' ' + rdv.time,
    '• ' + x.waName + ' : ' + rdv.name.trim(),
    '• ' + x.waPhone + ' : ' + rdv.phone.trim()];
  if (rdv.notes.trim()) lines.push('• ' + x.waNotes + ' : ' + rdv.notes.trim());
  rdv.waUrl = 'https://wa.me/' + rdvPhone().intl + '?text=' + encodeURIComponent(lines.join('\n'));
  if (!sb) { window.open(rdv.waUrl, '_blank', 'noopener'); rdv.saved = null; rdv.done = true; render(); return; }
  rdv.sending = true; document.getElementById('recap').innerHTML = rdvRecapHtml();
  const brand = rdv.brand === '__other' ? rdv.brandOther : rdv.brand;
  const model = (rdv.brand === '__other' || rdv.model === '__other') ? rdv.modelOther : rdv.model;
  const { error } = await sb.from('appointments').insert({
    services: rdv.services, box_type: rdv.box, brand: brand || null, model: model || null, year: rdv.year || null,
    notes: rdv.notes.trim() || null, workshop: rdv.shop, appt_date: ymd(day), appt_time: rdv.time,
    customer_name: rdv.name.trim(), phone: rdv.phone.trim(), lang
  });
  rdv.sending = false; rdv.saved = !error; rdv.done = true;
  if (error) console.error(error);
  render(); window.scrollTo(0, 0);
}

/* ---------- Suivi (réel, via Supabase) ---------- */
async function fetchTrack(silent) {
  if (!sb || !trk.code.trim() || !trk.phone.trim()) return;
  if (!silent) { trk.loading = true; trk.error = ''; render(); }
  const { data, error } = await sb.rpc('track_repair', { p_code: trk.code.trim(), p_phone: trk.phone.trim() });
  trk.loading = false;
  if (error) { trk.error = t().trackErr; trk.data = null; }
  else if (!data) { trk.error = t().trackNotFound; trk.data = null; }
  else { trk.error = ''; trk.data = data; store.set('abv-track', JSON.stringify({ code: trk.code, phone: trk.phone })); }
  if (route() === 'suivi') { const el = document.getElementById('trk-result'); if (el && silent) el.innerHTML = trackResultHtml(); else render(); }
}
async function approveQuote() {
  if (!sb || trk.approving) return;
  trk.approving = true;
  await sb.rpc('approve_quote', { p_code: trk.code.trim(), p_phone: trk.phone.trim() });
  trk.approving = false; fetchTrack(false);
}
function startTrackPolling() {
  clearInterval(trk.timer);
  trk.timer = setInterval(() => { if (route() === 'suivi' && trk.data && document.visibilityState === 'visible') fetchTrack(true); }, 15000);
}
function trackResultHtml() {
  const x = t(); const d = trk.data;
  if (trk.loading) return '<p class="muted">…</p>';
  if (trk.error) return '<p class="demo-note">' + esc(trk.error) + '</p>';
  if (!d) return '';
  const n = x.steps7.length; const step = Math.min(d.step, n - 1);
  const evAt = {}; (d.events || []).forEach((e) => { if (e.step !== null && e.step !== undefined) evAt[e.step] = e.at; });
  const fmt = (s) => s ? new Date(s).toLocaleString(x.locale, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  const car = [d.brand, d.model, x.bx[d.box_type]].filter(Boolean).join(' · ');
  const money = (v) => Number(v).toLocaleString(x.locale) + ' ' + x.da;
  let quote = '';
  if (d.quote_status === 'en_attente') {
    quote = '<div class="info" style="border:2px solid var(--red)"><p class="lbl">' + esc(x.action) + '</p><h2 style="font-size:20px">' + esc(x.quoteTitle) + '</h2>' +
      (d.diagnosis ? '<p><b>' + esc(x.diagnosisL) + ' :</b> ' + esc(d.diagnosis) + '</p>' : '') +
      (d.quote_amount ? '<p style="font-family:var(--head);font-weight:800;font-size:24px">' + esc(money(d.quote_amount)) + '</p>' : '<p class="muted" style="font-size:14px">' + esc(x.quoteSub) + '</p>') +
      '<div style="display:flex;gap:8px"><button class="btn btn-red" style="flex:1" type="button" data-act="trk-approve"' + (trk.approving ? ' disabled' : '') + '>' + esc(x.approve) + '</button><a class="btn btn-ghost" style="flex:1" href="tel:+' + (d.box_type === 'man' ? INFO.phoneManual.intl : INFO.phoneAuto.intl) + '">' + esc(x.call) + '</a></div></div>';
  } else if (d.quote_status === 'valide') {
    quote = '<div class="info"><p class="lbl">' + esc(x.quoteAmount) + '</p>' + (d.quote_amount ? '<p style="font-family:var(--head);font-weight:800;font-size:22px">' + esc(money(d.quote_amount)) + '</p>' : '') + '<p style="color:#4ADE80;font-weight:700">' + esc(x.quoteApproved) + '</p>' + (d.diagnosis ? '<p class="muted" style="font-size:14px">' + esc(x.diagnosisL) + ' : ' + esc(d.diagnosis) + '</p>' : '') + '</div>';
  } else if (d.quote_status === 'refuse') {
    quote = '<div class="info"><p class="lbl">' + esc(x.quoteRefused) + '</p></div>';
  } else if (d.diagnosis) {
    quote = '<div class="info"><p class="lbl">' + esc(x.diagnosisL) + '</p><p>' + esc(d.diagnosis) + '</p></div>';
  }
  return '<div class="info"><p class="muted" style="font-size:13px">' + esc(x.yourCar) + ' · ' + esc(d.code) + '</p><p style="font-family:var(--head);font-weight:800;font-size:22px">' + esc(car || '—') + '</p>' +
      '<div style="display:flex;gap:6px" aria-hidden="true">' + x.steps7.map((s, i) => '<span style="flex:1;height:6px;border-radius:3px;background:' + (i <= step ? 'var(--red)' : '#3A3A40') + '"></span>').join('') + '</div>' +
      '<p style="font-weight:700;font-size:14px">' + esc(fill(x.stepOf, { a: step + 1, b: n })) + ' · ' + esc(x.steps7[step]) + '</p>' +
      '<p class="muted" style="font-size:12px">' + esc(x.lastUpdate) + ' : ' + esc(fmt(d.updated_at)) + ' · ' + esc(x.liveNote) + '</p></div>' + quote +
    '<ol class="timeline">' + x.steps7.map((ti, i) => { const st = i < step ? 'done' : i === step ? 'now' : 'todo';
      return '<li><div class="rail"><span class="dot ' + st + '"></span>' + (i < n - 1 ? '<span class="vbar ' + (st === 'done' ? 'done' : '') + '"></span>' : '') + '</div><div class="txt"><p style="font-weight:' + (st === 'todo' ? 500 : 700) + ';color:' + (st === 'todo' ? 'var(--muted)' : '#fff') + '">' + esc(ti) + '</p>' + (evAt[i] && st !== 'todo' ? '<p class="muted" style="font-size:13px">' + esc(fmt(evAt[i])) + '</p>' : '') + '</div></li>'; }).join('') + '</ol>';
}
function trackPage() {
  const x = t();
  if (!sb) return '<div class="track"><p class="eyebrow">' + esc(x.navTrack) + '</p><h1 style="font-size:36px;font-weight:900">' + esc(x.trackTitle) + '</h1><p class="demo-note">' + esc(x.demo) + '</p></div>';
  return '<div class="track"><p class="eyebrow">' + esc(x.navTrack) + '</p><h1 style="font-size:36px;font-weight:900">' + esc(x.trackTitle) + '</h1><p class="muted">' + esc(x.trackSub) + '</p>' +
    '<form id="trk-form" class="cols" novalidate><label class="f">' + esc(x.fileNo) + '<input type="text" data-tfield="code" value="' + esc(trk.code) + '" placeholder="ABV-1001" autocapitalize="characters"></label>' +
    '<label class="f">' + esc(x.trackPhone) + '<input type="tel" dir="ltr" data-tfield="phone" value="' + esc(trk.phone) + '" placeholder="05 / 06 / 07 …"></label>' +
    '<button class="btn btn-red" type="submit">' + esc(x.search) + '</button></form>' +
    '<div id="trk-result" style="display:flex;flex-direction:column;gap:18px">' + trackResultHtml() + '</div></div>';
}

/* ---------- Rendu & routes ---------- */
function route() { const h = location.hash.replace(/^#\/?/, '').split('#')[0].split('?')[0]; return ['rdv', 'pieces', 'suivi'].includes(h) ? h : 'home'; }
function render() {
  const x = t(); const r = route();
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = x[el.dataset.t]; });
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  document.querySelectorAll('nav.main [data-route]').forEach((a) => { if (a.dataset.route === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  app.innerHTML = r === 'rdv' ? rdvPage() : r === 'pieces' ? partsPage() : r === 'suivi' ? trackPage() : home();
}
function staticSetup() {
  document.getElementById('year').textContent = new Date().getFullYear();
  document.querySelectorAll('[data-social="tiktok"]').forEach((a) => { a.href = INFO.tiktok; });
  document.getElementById('dir-link').href = 'https://www.google.com/maps/dir/?api=1&destination=' + INFO.hq.lat + ',' + INFO.hq.lng + '&destination_place_id=' + INFO.hq.placeId;
  document.getElementById('maps-link').href = 'https://www.google.com/maps/search/?api=1&query=Ahmed+Boite+Vitesse+Ouled+Moussa&query_place_id=' + INFO.hq.placeId;
  document.getElementById('map').src = 'https://maps.google.com/maps?q=' + INFO.hq.lat + ',' + INFO.hq.lng + '&z=15&output=embed';
  document.getElementById('credits').innerHTML = 'Voitures : photos fournies par l’entreprise.<br>Pièces (Wikimedia Commons) : ' +
    Object.values(PHOTO).map((p) => '<a href="' + esc(p.src.replace('Special:FilePath/', 'File:').replace('?width=500', '')) + '" target="_blank" rel="noopener">' + esc(p.credit) + '</a>').join(' · ');
}
document.addEventListener('click', (e) => {
  const lb = e.target.closest('[data-lang]'); if (lb) { lang = lb.dataset.lang; store.set('abv-lang', lang); render(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return; const v = b.dataset.v;
  switch (b.dataset.act) {
    case 'svc': rdv.services = rdv.services.includes(v) ? rdv.services.filter((k) => k !== v) : rdv.services.concat(v); rdv.error = ''; break;
    case 'box': rdv.box = v; break;
    case 'shop': rdv.shop = v; break;
    case 'day': rdv.day = +v; break;
    case 'cat': parts.cat = v; break;
    case 'rdv-reset': Object.assign(rdv, { done: false, saved: null, waUrl: '', services: [], notes: '', error: '' }); break;
    case 'trk-approve': approveQuote(); return;
  }
  render();
});
document.addEventListener('input', (e) => {
  const tf = e.target.dataset && e.target.dataset.tfield; if (tf) { trk[tf] = e.target.value; return; }
  const f = e.target.dataset && e.target.dataset.field; if (!f) return;
  if (f === 'q') { parts.q = e.target.value; document.getElementById('parts-grid').innerHTML = partsGridHtml(0); document.getElementById('count').textContent = partsList().length + ' ' + t().results; return; }
  rdv[f] = e.target.value; rdv.error = '';
  if (f === 'time') { const m = document.getElementById('time-msg'); m.textContent = timeMsgHtml(); m.className = 'time-msg' + (timeValid() ? '' : ' bad'); }
  const recap = document.getElementById('recap'); if (recap) recap.innerHTML = rdvRecapHtml();
});
document.addEventListener('change', (e) => {
  const f = e.target.dataset && e.target.dataset.field;
  if (f === 'brand') { rdv.brand = e.target.value; rdv.model = ''; render(); }
  else if (f === 'model') { rdv.model = e.target.value; render(); }
});
document.addEventListener('submit', (e) => {
  if (e.target.id === 'rdv-form') { e.preventDefault(); rdvSubmit(); }
  if (e.target.id === 'trk-form') { e.preventDefault(); fetchTrack(false); }
});
window.addEventListener('hashchange', () => {
  readHashCode(); render(); if (route() === 'suivi' && trk.code && trk.phone && !trk.data) fetchTrack(false); const anchor = location.hash.split('#')[2];
  if (anchor) { const el = document.getElementById(anchor); if (el) el.scrollIntoView(); } else window.scrollTo(0, 0);
});
staticSetup();
function readHashCode() { const m = location.hash.match(/[?&]code=([^&#]+)/); if (m && decodeURIComponent(m[1]) !== trk.code) { trk.code = decodeURIComponent(m[1]); trk.data = null; trk.error = ''; } }
readHashCode();
render(); loadParts(); startTrackPolling();
if (route() === 'suivi' && trk.code && trk.phone) fetchTrack(false);
</script>

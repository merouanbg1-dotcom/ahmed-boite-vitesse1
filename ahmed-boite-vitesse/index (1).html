<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Ahmed Boîte Vitesse</title>
<link rel="icon" href="../images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --red:#E31B23; --red-2:#C8141B; --red-text:#FF5A5F;
  --bg:#0B0B0C; --panel:#141417; --panel-2:#1B1B1F; --line:#2A2A2F; --line-2:#3A3A40;
  --text:#fff; --muted:#A9A9B3; --green:#22C55E; --amber:#F59E0B; --blue:#3B82F6;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
a{color:var(--text)}
h1,h2,h3{font-family:'Montserrat','Inter',sans-serif;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--red-text);outline-offset:2px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;min-height:40px;padding:8px 14px;border-radius:6px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;background:var(--panel-2);color:#fff;border-color:var(--line-2)}
.btn:hover{border-color:#5A5A62}
.btn.red{background:var(--red);border-color:var(--red)} .btn.red:hover{background:var(--red-2)}
.btn.green{background:#15803D;border-color:#15803D}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;background:var(--bg);color:#fff;border:1px solid var(--line-2);border-radius:6px;padding:10px 12px;min-height:42px}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#D4D4DA}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login form{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:8px;padding:28px;display:flex;flex-direction:column;gap:14px}
.login img{height:90px;width:auto;align-self:center}
.err{color:#FCA5A5;font-size:14px;font-weight:600}

/* Layout */
.app{display:flex;min-height:100vh}
aside.side{width:230px;flex:none;background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:6px;position:sticky;top:0;height:100vh}
aside.side img{height:64px;width:auto;margin:4px auto 14px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:start;background:transparent;border:0;color:#E4E4EA;font-weight:600;padding:11px 12px;border-radius:6px;cursor:pointer;min-height:44px}
.nav:hover{background:var(--panel-2)}
.nav[aria-current="page"]{background:var(--red);color:#fff}
.nav .count{background:#fff;color:#111;border-radius:999px;font-size:12px;font-weight:800;padding:1px 8px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:13px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.top h1{font-size:22px;font-weight:800}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.live i{width:10px;height:10px;border-radius:50%;background:#6A6A72}
.live.on i{background:var(--green);box-shadow:0 0 0 4px rgba(34,197,94,.2)}
.content{padding:22px 24px 60px;display:flex;flex-direction:column;gap:20px}

/* Cards & tables */
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:6px;text-align:start;cursor:pointer;color:#fff}
.kpi b{font-family:'Montserrat',sans-serif;font-size:34px;font-weight:900;line-height:1}
.kpi span{color:var(--muted);font-size:14px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.card-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:17px;font-weight:800}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel-2)}
tr.flash td{animation:flash 2.5s ease}
@keyframes flash{0%{background:rgba(227,27,35,.35)}100%{background:transparent}}
.empty{padding:28px;text-align:center;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.b-nouveau{background:#3B0A0C;color:#FF8A8E;border-color:#7A1A1F}
.b-confirme{background:#0B2A17;color:#86EFAC;border-color:#166534}
.b-termine{background:#1E293B;color:#CBD5E1;border-color:#334155}
.b-annule{background:#262626;color:#A3A3A3;border-color:#404040;text-decoration:line-through}
.b-step{background:#1E1B4B;color:#C7D2FE;border-color:#3730A3}
.b-quote{background:#3A2A00;color:#FDE68A;border-color:#854D0E}
.b-ok{background:#0B2A17;color:#86EFAC;border-color:#166534}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{background:var(--panel-2);border:1px solid var(--line-2);color:#E4E4EA;border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer;font-weight:600;font-size:13px}
.tab[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.filters input,.filters select{width:auto;min-width:180px}

/* Drawer & modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);height:100%;overflow-y:auto;background:var(--panel);border-inline-start:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:16px}
.drawer h2{font-size:20px;font-weight:800}
.dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:14px}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-weight:600}
.sec{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.sec h3{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--red-text)}
.stepper{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.stepper button{background:var(--panel-2);border:1px solid var(--line-2);color:#E4E4EA;border-radius:6px;padding:8px 4px;font-size:11.5px;font-weight:700;cursor:pointer;min-height:56px;line-height:1.2}
.stepper button.done{background:#3B0A0C;border-color:#7A1A1F;color:#FFB4B7}
.stepper button.now{background:var(--red);border-color:var(--red);color:#fff}
.events{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.events li{display:flex;gap:10px} .events time{color:var(--muted);flex:none;width:120px}
.code{font-family:'Montserrat',sans-serif;font-weight:900;font-size:22px;letter-spacing:1px}
.thumb{width:48px;height:48px;border-radius:6px;object-fit:cover;background:#fff}
.thumb.ph{display:flex;align-items:center;justify-content:center;background:var(--panel-2);color:#6A6A72;font-size:11px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:600}
.toggle input{width:20px;height:20px;min-height:0;accent-color:var(--red)}

/* Factures */
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 80px 120px 110px 40px;gap:8px;align-items:center}
.line .amt{text-align:end;font-weight:700;font-size:14px}
.line-h{display:grid;grid-template-columns:minmax(0,1fr) 80px 120px 110px 40px;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.line-h span:nth-child(4){text-align:end}
.totbox{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.totbox div{display:flex;justify-content:space-between;gap:10px}
.totbox .ttc{font-family:'Montserrat',sans-serif;font-weight:900;font-size:20px;color:#fff;border-top:1px solid var(--line);padding-top:8px}
.words{font-size:12.5px;color:var(--muted);font-style:italic}
.b-payee{background:#0B2A17;color:#86EFAC;border-color:#166534}
.b-impayee{background:#3A2A00;color:#FDE68A;border-color:#854D0E}
.b-annulee{background:#262626;color:#A3A3A3;border-color:#404040;text-decoration:line-through}
.settings{max-width:820px}
@media (max-width:600px){.line,.line-h{grid-template-columns:minmax(0,1fr) 60px 90px 40px}.line .amt,.line-h span:nth-child(4){display:none}}

/* Toasts */
.toasts{position:fixed;bottom:18px;inset-inline-end:18px;z-index:60;display:flex;flex-direction:column;gap:10px}
.toast{background:#fff;color:#111;border-inline-start:6px solid var(--red);border-radius:8px;padding:12px 14px;min-width:260px;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:14px}
.toast b{display:block;margin-bottom:2px}

@media (max-width:860px){
  .app{flex-direction:column}
  aside.side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}
  aside.side img{height:44px;margin:0 8px 0 0}
  .nav{width:auto}
  .side .foot{margin:0;flex-direction:row;align-items:center;margin-inline-start:auto}
  .top{position:static;padding:12px 16px}
  .content{padding:16px}
  .stepper{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin/invoice-pdf.js"></script>
<script>
/* =====================================================================
   Ahmed Boîte Vitesse — interface admin (Supabase, temps réel)
   ===================================================================== */
const CFG = window.ABV_CONFIG || {};
const CONFIGURED = !!(window.supabase && CFG.supabaseUrl && CFG.supabaseAnonKey && !/VOTRE/.test(CFG.supabaseUrl + CFG.supabaseAnonKey));
const sb = CONFIGURED ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey) : null;
const SITE = (CFG.siteUrl || location.origin).replace(/\/$/, '');

const SVC = { diag: 'Diagnostic scanner', vid: 'Vidange de boîte', repA: 'Réparation boîte auto', repM: 'Réparation boîte manuelle', emb: 'Changement d’embrayage', dsg: 'DSG / mécatronique', noise: 'Bruit / à-coups', part: 'Pièce (achat/pose)', quote: 'Devis seulement' };
const BOX = { man: 'Manuelle', auto: 'Automatique', dsg: 'DSG', cvt: 'CVT', nsp: 'Inconnu' };
const SHOP = { om: 'Ouled Moussa', bo: 'Bouira' };
const ASTATUS = { nouveau: 'Nouveau', confirme: 'Confirmé', termine: 'Terminé', annule: 'Annulé' };
const STEPS = ['Reçu', 'Diagnostic', 'Devis à valider', 'Réparation', 'Contrôle & essai', 'Prêt à récupérer', 'Rendu'];
const QSTATUS = { aucun: 'Pas de devis', en_attente: 'Devis en attente', valide: 'Devis validé', refuse: 'Devis refusé' };
const PAY = { especes: 'Espèces', cheque: 'Chèque', virement: 'Virement bancaire', ccp: 'CCP / BaridiMob', autre: 'Autre' };
const ISTATUS = { impayee: 'Non payée', payee: 'Payée', annulee: 'Annulée' };
const CATS = { emb: 'Embrayage', man: 'Boîte manuelle', auto: 'Boîte automatique', dsg: 'DSG / mécatronique', cvt: 'CVT', oil: 'Huiles & filtres', sens: 'Capteurs & commandes', full: 'Boîtes complètes' };

const S = {
  user: null, isAdmin: false, view: 'dash', live: false, loading: true,
  appts: [], repairs: [], parts: [], events: {}, invoices: [], settings: null, inv: null, iFilter: 'tous', iSearch: '',
  aFilter: 'nouveau', aShop: '', aSearch: '', rFilter: 'encours', rSearch: '', pCat: '',
  drawer: null, flash: new Set(), busy: false, loginErr: ''
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fmtDate = (d) => d ? new Date(d + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
const fmtDT = (d) => d ? new Date(d).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const hm = (t) => (t || '').slice(0, 5);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const money = (v) => v === null || v === undefined || v === '' ? '' : Number(v).toLocaleString('fr-FR') + ' DA';
const intlPhone = (p) => { const d = String(p || '').replace(/\D/g, ''); return d.startsWith('213') ? d : d.startsWith('0') ? '213' + d.slice(1) : d.length === 9 ? '213' + d : d; };
const waLink = (phone, text) => 'https://wa.me/' + intlPhone(phone) + (text ? '?text=' + encodeURIComponent(text) : '');
const trackUrl = () => SITE + '/#/suivi';

function toast(title, body) {
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = '<b>' + esc(title) + '</b>' + esc(body || '');
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 6000);
}
function beep() {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(); [0, 0.18].forEach((d) => { const o = c.createOscillator(); const g = c.createGain(); o.frequency.value = 880; g.gain.value = 0.08; o.connect(g); g.connect(c.destination); o.start(c.currentTime + d); o.stop(c.currentTime + d + 0.12); }); } catch (e) {}
}

/* ---------------- Données ---------------- */
async function loadAll() {
  S.loading = true; render();
  const since = new Date(Date.now() - 120 * 864e5).toISOString().slice(0, 10);
  const [a, r, p, inv, st] = await Promise.all([
    sb.from('appointments').select('*').gte('appt_date', since).order('appt_date', { ascending: true }).order('appt_time', { ascending: true }).limit(1000),
    sb.from('repairs').select('*').order('updated_at', { ascending: false }).limit(1000),
    sb.from('parts').select('*').order('category').order('sort'),
    sb.from('invoices').select('*').order('created_at', { ascending: false }).limit(2000),
    sb.from('settings').select('*').eq('id', 1).maybeSingle()
  ]);
  const err = a.error || r.error || p.error || inv.error || st.error;
  if (err) toast('Erreur de chargement', err.message);
  S.appts = a.data || []; S.repairs = r.data || []; S.parts = p.data || []; S.invoices = inv.data || []; S.settings = st.data || null;
  S.loading = false; render();
}
async function loadEvents(repairId) {
  const { data } = await sb.from('repair_events').select('*').eq('repair_id', repairId).order('created_at');
  S.events[repairId] = data || []; render();
}
function upsertLocal(list, row) { const i = list.findIndex((x) => x.id === row.id); if (i >= 0) list[i] = row; else list.unshift(row); }
function removeLocal(list, id) { const i = list.findIndex((x) => x.id === id); if (i >= 0) list.splice(i, 1); }

let channel = null;
function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('admin-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'appointments' }, (ev) => {
      if (ev.eventType === 'DELETE') removeLocal(S.appts, ev.old.id); else upsertLocal(S.appts, ev.new);
      if (ev.eventType === 'INSERT') {
        S.flash.add(ev.new.id); beep();
        toast('Nouveau rendez-vous', ev.new.customer_name + ' · ' + fmtDate(ev.new.appt_date) + ' ' + hm(ev.new.appt_time));
        if (document.hidden && 'Notification' in window && Notification.permission === 'granted') new Notification('Nouveau RDV — ' + ev.new.customer_name, { body: fmtDate(ev.new.appt_date) + ' ' + hm(ev.new.appt_time), icon: '../images/favicon.png' });
      }
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'repairs' }, (ev) => {
      if (ev.eventType === 'DELETE') removeLocal(S.repairs, ev.old.id); else upsertLocal(S.repairs, ev.new);
      if (ev.eventType === 'UPDATE' && ev.old && ev.old.quote_status !== 'valide' && ev.new.quote_status === 'valide') { beep(); toast('Devis validé', ev.new.code + ' · ' + ev.new.customer_name); }
      S.flash.add(ev.new && ev.new.id); render();
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'repair_events' }, (ev) => {
      const id = ev.new.repair_id; if (S.events[id]) { S.events[id].push(ev.new); render(); }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'invoices' }, (ev) => {
      if (ev.eventType === 'DELETE') removeLocal(S.invoices, ev.old.id); else upsertLocal(S.invoices, ev.new);
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'parts' }, (ev) => {
      if (ev.eventType === 'DELETE') removeLocal(S.parts, ev.old.id); else upsertLocal(S.parts, ev.new);
      render();
    })
    .subscribe((status) => { S.live = status === 'SUBSCRIBED'; renderTop(); if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setTimeout(subscribe, 4000); });
}

/* ---------------- Actions ---------------- */
async function run(promise, okMsg) {
  S.busy = true; render();
  const { data, error } = await promise;
  S.busy = false;
  if (error) { toast('Erreur', error.message); render(); return null; }
  if (okMsg) toast(okMsg);
  render(); return data || true;
}
const updAppt = (id, patch, msg) => run(sb.from('appointments').update(patch).eq('id', id).select().single(), msg).then((d) => { if (d && d.id) upsertLocal(S.appts, d); render(); return d; });
const updRepair = (id, patch, msg) => run(sb.from('repairs').update(patch).eq('id', id).select().single(), msg).then((d) => { if (d && d.id) { upsertLocal(S.repairs, d); loadEvents(d.id); } return d; });

async function createRepairFromAppt(a) {
  const d = await run(sb.from('repairs').insert({ appointment_id: a.id, customer_name: a.customer_name, phone: a.phone, brand: a.brand, model: a.model, box_type: a.box_type, workshop: a.workshop, step: 0 }).select().single(), 'Dossier créé');
  if (d && d.id) { upsertLocal(S.repairs, d); await updAppt(a.id, { repair_id: d.id, status: a.status === 'nouveau' ? 'confirme' : a.status }); openRepair(d.id); }
}
async function saveRepairForm(form, id) {
  const f = Object.fromEntries(new FormData(form).entries());
  const patch = { customer_name: f.customer_name.trim(), phone: f.phone.trim(), brand: f.brand || null, model: f.model || null, box_type: f.box_type, workshop: f.workshop };
  if (!patch.customer_name || !patch.phone) { toast('Nom et téléphone obligatoires'); return; }
  if (id) await updRepair(id, patch, 'Dossier enregistré');
  else { const d = await run(sb.from('repairs').insert({ ...patch, step: 0 }).select().single(), 'Dossier créé'); if (d && d.id) { upsertLocal(S.repairs, d); openRepair(d.id); } }
}
async function uploadPhoto(file) {
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
  const path = 'p-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
  const { error } = await sb.storage.from('parts').upload(path, file, { cacheControl: '31536000', upsert: false });
  if (error) { toast('Erreur photo', error.message); return null; }
  return sb.storage.from('parts').getPublicUrl(path).data.publicUrl;
}
async function savePartForm(form, id) {
  const f = new FormData(form);
  const patch = {
    category: f.get('category'), name_fr: String(f.get('name_fr') || '').trim(), name_ar: String(f.get('name_ar') || '').trim() || null, name_en: String(f.get('name_en') || '').trim() || null,
    price: f.get('price') ? Number(f.get('price')) : null, sort: Number(f.get('sort') || 100), in_stock: f.get('in_stock') === 'on', active: f.get('active') === 'on'
  };
  if (!patch.name_fr) { toast('Le nom (FR) est obligatoire'); return; }
  const file = f.get('photo');
  if (file && file.size) { S.busy = true; render(); const url = await uploadPhoto(file); S.busy = false; if (!url) return; patch.photo_url = url; }
  if (f.get('remove_photo') === 'on') patch.photo_url = null;
  const q = id ? sb.from('parts').update(patch).eq('id', id).select().single() : sb.from('parts').insert(patch).select().single();
  const d = await run(q, id ? 'Pièce enregistrée' : 'Pièce ajoutée');
  if (d && d.id) { upsertLocal(S.parts, d); S.drawer = null; render(); }
}

function cleanItems(items) { return items.map((it) => ({ label: String(it.label || '').trim(), qty: Number(it.qty || 0), unit_price: Number(it.unit_price || 0) })).filter((it) => it.label || it.unit_price); }
async function saveInvoice(then) {
  const d = S.inv;
  if (!String(d.customer_name || '').trim()) { toast('Le nom du client est obligatoire'); return; }
  const items = cleanItems(d.items);
  if (!items.length) { toast('Ajoutez au moins une ligne'); return; }
  const t = I.totals({ ...d, items });
  const row = { invoice_date: d.invoice_date || today(), repair_id: d.repair_id || null, customer_name: d.customer_name.trim(), customer_phone: d.customer_phone || null, customer_address: d.customer_address || null,
    customer_tax_id: d.customer_tax_id || null, vehicle: d.vehicle || null, items, discount: Number(d.discount || 0), tva_rate: Number(d.tva_rate || 0), stamp_duty: Number(d.stamp_duty || 0),
    total_ht: t.ht, total_tva: t.tva, total_ttc: t.ttc, payment_method: d.payment_method, status: d.status, notes: d.notes || null };
  const q = d.id ? sb.from('invoices').update(row).eq('id', d.id).select().single() : sb.from('invoices').insert(row).select().single();
  const saved = await run(q, d.id ? 'Facture enregistrée' : 'Facture créée');
  if (saved && saved.id) { upsertLocal(S.invoices, saved); S.inv = { ...saved, items: saved.items.length ? saved.items : [{ label: '', qty: 1, unit_price: '' }] }; S.drawer = { type: 'invoice', id: saved.id }; render(); if (then === 'pdf') downloadPdf(saved); }
}
let LOGO = null;
async function logoBytes() {
  if (LOGO) return LOGO;
  try { const r = await fetch('../images/logo-facture.jpg'); if (r.ok) LOGO = new Uint8Array(await r.arrayBuffer()); } catch (e) {}
  return LOGO;
}
function invForPrint(x) { const rep = x.repair_id && S.repairs.find((r) => r.id === x.repair_id); return { ...x, repair_code: rep ? rep.code : '' }; }
async function downloadPdf(x) {
  const set = S.settings || {}; const inv = invForPrint(x);
  const txt = [inv.customer_name, inv.customer_address, inv.vehicle, inv.notes, set.company_name, set.address, set.activity].concat((inv.items || []).map((i) => i.label)).join(' ');
  if (!I.canEncode(txt)) { toast('Texte en arabe détecté', 'Utilisez « Enregistrer en PDF » dans la fenêtre d’impression.'); printInvoice(x); return; }
  const bytes = I.buildPdf(inv, set, await logoBytes());
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  const a = document.createElement('a'); a.href = url; a.download = (inv.number || 'facture') + '.pdf'; document.body.appendChild(a); a.click(); a.remove();

/* ---------------- Événements ---------------- */
document.addEventListener('click', async (e) => {
  const t = e.target;
  if (t.matches('[data-overlay]')) { S.drawer = null; render(); return; }
  const el = t.closest('button, a, tr'); if (!el) return;
  const d = el.dataset;
  if ('close' in d) { S.drawer = null; S.inv = null; render(); return; }
  if ('logout' in d) { await sb.auth.signOut(); return; }
  if ('reload' in d) { loadAll(); return; }
  if ('notif' in d) { Notification.requestPermission().then(render); return; }
  if (d.go) { S.view = d.go; if (d.af) S.aFilter = d.af; if (d.rf) S.rFilter = d.rf; S.drawer = null; render(); window.scrollTo(0, 0); return; }
  if (d.af && !d.go) { S.aFilter = d.af; render(); return; }
  if (d.rf && !d.go) { S.rFilter = d.rf; render(); return; }
  if (d.pc !== undefined) { S.pCat = d.pc; render(); return; }
  if (d.if) { S.iFilter = d.if; render(); return; }
  if (d.pdf) { e.stopPropagation(); const x = S.invoices.find((v) => v.id === d.pdf); if (x) downloadPdf(x); return; }
  if (d.openInvoice) { const x = S.invoices.find((v) => v.id === d.openInvoice); if (x) { S.inv = JSON.parse(JSON.stringify(x)); if (!S.inv.items.length) S.inv.items = [{ label: '', qty: 1, unit_price: '' }]; S.drawer = { type: 'invoice', id: x.id }; render(); } return; }
  if ('newInvoice' in d) { S.inv = newInvoiceDraft(null); S.drawer = { type: 'invoice', id: null }; render(); return; }
  if ('invoiceFromRepair' in d && S.drawer) { const r = S.repairs.find((x) => x.id === S.drawer.id); S.inv = newInvoiceDraft(r); S.drawer = { type: 'invoice', id: null }; render(); return; }
  if ('addLine' in d && S.inv) { S.inv.items.push({ label: '', qty: 1, unit_price: '' }); render(); return; }
  if (d.delLine !== undefined && S.inv) { S.inv.items.splice(Number(d.delLine), 1); render(); return; }
  if ('saveInvoice' in d && S.inv) { saveInvoice(d.then); return; }
  if ('printInvoice' in d && S.inv && S.inv.id) { printInvoice(S.inv); return; }
  if (d.openAppt) { S.drawer = { type: 'appt', id: d.openAppt }; render(); return; }
  if (d.openRepair) { openRepair(d.openRepair); return; }
  if (d.openPart) { S.drawer = { type: 'part', id: d.openPart }; render(); return; }
  if ('newRepair' in d) { S.drawer = { type: 'repair', id: null }; render(); return; }
  if ('newPart' in d) { S.drawer = { type: 'part', id: null }; render(); return; }
  const cur = S.drawer;
  if (d.apptStatus && cur) { updAppt(cur.id, { status: d.apptStatus }, 'Statut : ' + ASTATUS[d.apptStatus]); return; }
  if ('saveApptNote' in d && cur) { updAppt(cur.id, { admin_note: $('#appt-note').value.trim() || null }, 'Note enregistrée'); return; }
  if ('repairFromAppt' in d && cur) { const a = S.appts.find((x) => x.id === cur.id); if (a) createRepairFromAppt(a); return; }
  if (d.step !== undefined && cur) { updRepair(cur.id, { step: Number(d.step) }, 'Étape : ' + STEPS[Number(d.step)]); return; }
  if ('saveDiag' in d && cur) { const amt = $('#r-amount').value; updRepair(cur.id, { diagnosis: $('#r-diag').value.trim() || null, quote_amount: amt === '' ? null : Number(amt) }, 'Enregistré'); return; }
  if ('sendQuote' in d && cur) {
    const amt = $('#r-amount').value; if (amt === '') { toast('Indiquez le montant du devis'); return; }
    const r = S.repairs.find((x) => x.id === cur.id);
    updRepair(cur.id, { diagnosis: $('#r-diag').value.trim() || null, quote_amount: Number(amt), quote_status: 'en_attente', step: r && r.step > 2 ? r.step : 2 }, 'Devis envoyé : le client peut le valider en ligne'); return;
  }
  if (d.quote && cur) { const r = S.repairs.find((x) => x.id === cur.id); updRepair(cur.id, d.quote === 'valide' ? { quote_status: 'valide', step: Math.max(3, r.step) } : { quote_status: 'refuse' }, d.quote === 'valide' ? 'Devis validé' : 'Devis refusé'); return; }
  if ('saveRnote' in d && cur) { updRepair(cur.id, { internal_note: $('#r-note').value.trim() || null }, 'Note enregistrée'); return; }
  if ('delRepair' in d && cur) { if (!confirm('Supprimer définitivement ce dossier ?')) return; const ok = await run(sb.from('repairs').delete().eq('id', cur.id), 'Dossier supprimé'); if (ok) { removeLocal(S.repairs, cur.id); S.drawer = null; render(); } return; }
  if ('delPart' in d && cur) { if (!confirm('Supprimer cette pièce ?')) return; const ok = await run(sb.from('parts').delete().eq('id', cur.id), 'Pièce supprimée'); if (ok) { removeLocal(S.parts, cur.id); S.drawer = null; render(); } return; }
});
document.addEventListener('input', (e) => {
  const ds = e.target.dataset || {};
  if (S.inv && (ds.inv || ds.line !== undefined)) {
    if (ds.inv) S.inv[ds.inv] = e.target.value;
    else { const it = S.inv.items[Number(ds.line)]; it[ds.k] = e.target.value; const a = document.getElementById('amt-' + ds.line); if (a) a.textContent = I.num(Number(it.qty || 0) * Number(it.unit_price || 0)); }
    const tb = document.getElementById('inv-totals'); if (tb) tb.innerHTML = invTotalsHtml(S.inv);
    return;
  }
  const f = ds.filter; if (!f) return;
  S[f] = e.target.value;
  const list = $('#list'); if (!list) return;
  const html = S.view === 'appts' ? viewAppts() : S.view === 'invoices' ? viewInvoices() : viewRepairs();
  const tmp = document.createElement('div'); tmp.innerHTML = html; list.innerHTML = tmp.querySelector('#list').innerHTML;
});
document.addEventListener('change', (e) => {
  const ds = e.target.dataset || {};
  if (S.inv && 'invRepair' in ds) { const r = S.repairs.find((x) => x.id === e.target.value); if (r) Object.assign(S.inv, { repair_id: r.id, customer_name: r.customer_name, customer_phone: r.phone, vehicle: [r.brand, r.model, BOX[r.box_type]].filter(Boolean).join(' · ') }); else S.inv.repair_id = null; render(); return; }
  if (S.inv && 'addPart' in ds) { const p = S.parts.find((x) => x.id === e.target.value); if (p) { const empty = S.inv.items.findIndex((it) => !it.label && !it.unit_price); const line = { label: p.name_fr, qty: 1, unit_price: p.price ? Number(p.price) : '' }; if (empty >= 0) S.inv.items[empty] = line; else S.inv.items.push(line); } render(); return; }
  if (S.inv && ds.inv && e.target.tagName === 'SELECT') { S.inv[ds.inv] = e.target.value; const tb = document.getElementById('inv-totals'); if (tb) tb.innerHTML = invTotalsHtml(S.inv); return; }
  const f = ds.filter; if (f && e.target.tagName === 'SELECT') { S[f] = e.target.value; render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.drawer) { S.drawer = null; render(); } });
document.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (e.target.id === 'login-form') {
    const f = new FormData(e.target); S.loginEmail = f.get('email'); S.busy = true; S.loginErr = ''; render();
    const { error } = await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('password') });
    S.busy = false; if (error) { S.loginErr = error.message === 'Invalid login credentials' ? 'Email ou mot de passe incorrect.' : error.message; render(); }
    return;
  }
  if (e.target.id === 'repair-form') { saveRepairForm(e.target, S.drawer && S.drawer.id); return; }
  if (e.target.id === 'part-form') { savePartForm(e.target, S.drawer && S.drawer.id); return; }
  if (e.target.id === 'settings-form') {
    const f = Object.fromEntries(new FormData(e.target).entries());
    Object.keys(f).forEach((k) => { if (typeof f[k] === 'string') f[k] = f[k].trim() || null; });
    f.company_name = f.company_name || 'Ahmed Boîte Vitesse'; f.default_tva = Number(f.default_tva || 0);
    const d = await run(sb.from('settings').upsert({ id: 1, ...f }).select().single(), 'Paramètres enregistrés');
    if (d && d.id) { S.settings = d; render(); }
    return;
  }
});

/* ---------------- Démarrage ---------------- */
async function onSession(session) {
  S.user = session ? session.user : null;
  if (!S.user) { S.isAdmin = false; if (channel) { sb.removeChannel(channel); channel = null; } render(); return; }
  const { data } = await sb.from('admins').select('user_id').eq('user_id', S.user.id).maybeSingle();
  S.isAdmin = !!data; render();
  if (S.isAdmin) { await loadAll(); subscribe(); }
}
if (sb) {
  let started = false;
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'INITIAL_SESSION' || ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') {
      if (ev === 'SIGNED_IN' && started && S.user && session && S.user.id === session.user.id) return;
      started = true; setTimeout(() => onSession(session), 0);
    }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.isAdmin && !S.live) { loadAll(); subscribe(); } });
}
render();
</script>
</body>
</html>
